<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slider - AIUB Lab Task</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .slider-container{
            width: 700px;
            height: 400px;
            background: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        img{
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 10px;
        }

        button{
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            border: none;
            background: #007bff;
            color: white;
            border-radius: 5px;
            font-size: 16px;
        }

        button:hover{
            background: #0056b3;
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <h2>Travel Destination Slider</h2>

        <!-- Main image -->
        <img id="slider" src="" alt="Travel Image">

        <!-- Buttons -->
        <div>
            <button onclick="prevImage()">Previous</button>
            <button onclick="nextImage()">Next</button>
        </div>
    </div>

    <script>
        
        const images = [
            "https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg",
            "https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg",
            "https://images.pexels.com/photos/356830/pexels-photo-356830.jpeg",
            "https://images.pexels.com/photos/21014/pexels-photo.jpg"
        ];

        let index = 0;

        const slider = document.getElementById("slider");

        
        slider.src = images[index];

        
        function nextImage() {
            index++;
            if (index >= images.length) {
                index = 0;  
            }
            slider.src = images[index];
        }

        
        function prevImage() {
            index--;
            if (index < 0) {
                index = images.length - 1; 
            }
            slider.src = images[index];
        }

        
        setInterval(nextImage, 3000);
    </script>

</body>
</html>
