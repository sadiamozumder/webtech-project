<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }
        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #aaa;
            resize: none;
        }
        button {
            margin-top: 10px;
            padding: 12px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            background: #eef;
            padding: 15px;
            border-radius: 8px;
        }
        .result p {
            font-size: 18px;
            margin: 6px 0;
        }
    </style>

</head>
<body>

<div class="container">
    <h2>Text Analyzer Tool</h2>

    <textarea id="inputText" placeholder="Enter your text here..."></textarea>

    <button onclick="analyzeText()">Analyze Text</button>

    <div class="result" id="resultBox" style="display:none;">
        <p><b>Total Characters:</b> <span id="charCount"></span></p>
        <p><b>Total Words:</b> <span id="wordCount"></span></p>
        <p><b>Reversed Text:</b></p>
        <p id="reverseText" style="background:#fff; padding:10px; border-radius:6px;"></p>
    </div>
</div>

<script>
function analyzeText() {
    let text = document.getElementById("inputText").value.trim();

    if (text.length === 0) {
        alert("Please enter some text!");
        return;
    }

    let charCount = text.length;

    // split by spaces but remove empty items (multiple spaces handled)
    let words = text.split(/\s+/);
    let wordCount = words.filter(w => w !== "").length;

    // Reverse text using split + reverse + join
    let reversed = text.split("").reverse().join("");

    // Display results
    document.getElementById("charCount").innerText = charCount;
    document.getElementById("wordCount").innerText = wordCount;
    document.getElementById("reverseText").innerText = reversed;

    document.getElementById("resultBox").style.display = "block";
}
</script>

</body>
</html>
